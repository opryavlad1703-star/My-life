<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070806;
            --moss: #3e4a2e; 
            --fungus: #d9772b; 
            --ui-bg: rgba(20, 22, 18, 0.95);
            --border-color: #444;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: #e0e0e0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОН (Твоя картинка) === */
        .background-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                /* Потужна віньєтка та притемнення для стилю кіно */
                radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%),
                linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                url('bg-tlou.jpg'); /* ПЕРЕЙМЕНУЙ СВОЄ ФОТО НА bg-tlou.jpg */
            background-size: cover;
            background-position: center;
            z-index: -3;
            filter: contrast(1.2) saturate(0.7);
        }

        /* === ЕФЕКТ БРУДНОГО СКЛА === */
        .overlay-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dust.png');
            opacity: 0.3;
            pointer-events: none;
            z-index: 100;
        }

        /* === ЦЕНТРАЛЬНА ПАНЕЛЬ (Survivor Menu) === */
        .container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 380px;
            background: var(--ui-bg);
            padding: 45px 30px;
            border: 1px solid var(--border-color);
            /* Ефект старого металу */
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Ліани/мох, що наповзають на панель */
        .overgrowth {
            position: absolute;
            top: -10px; left: -10px; width: 60px; height: 60px;
            background: var(--moss);
            filter: blur(20px);
            opacity: 0.6;
            z-index: -1;
        }
        .overgrowth-bottom {
            position: absolute;
            bottom: -15px; right: -10px; width: 80px; height: 40px;
            background: var(--fungus);
            filter: blur(25px);
            opacity: 0.4;
            z-index: -1;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 40px 0;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid #333;
            display: inline-block;
            padding-bottom: 10px;
        }

        /* === КНОПКИ (Не прозорі, стильні) === */
        .link-card {
            display: block;
            background: #1a1c18; /* Солідний колір */
            border: 1px solid #333;
            margin: 15px 0;
            padding: 18px;
            text-decoration: none;
            color: #aaa;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .link-card:hover {
            background: #252822;
            border-color: var(--fungus);
            color: #fff;
            transform: translateX(8px);
            box-shadow: -5px 0 0 var(--fungus);
        }

        /* === HUD СТАТИСТИКА === */
        .status-box {
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .status-header {
            font-size: 12px;
            color: var(--moss);
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .health-bar {
            height: 4px;
            width: 100%;
            background: #111;
            position: relative;
        }

        .health-fill {
            height: 100%;
            width: 26%;
            background: var(--fungus);
            box-shadow: 0 0 15px var(--fungus);
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #spores-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="background-main"></div>
    <div class="overlay-dust"></div>
    <canvas id="spores-canvas"></canvas>

    <div class="container">
        <div class="overgrowth"></div>
        <div class="overgrowth-bottom"></div>
        
        <h1>VLAD</h1>
        
        <a href="https://t.me/vladoskarburator" class="link-card" target="_blank">Access Telegram</a>
        <a href="https://www.instagram.com/opria_vlad/" class="link-card" target="_blank">View Archives</a>
        <a href="https://www.twitch.tv/vlad1703gg" class="link-card" target="_blank">Live Broadcast</a>

        <div class="status-box">
            <div class="status-header">
                <span>THREAT LEVEL: HIGH</span>
                <span>INF: 26%</span>
            </div>
            <div class="health-bar">
                <div class="health-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spores-canvas');
        const ctx = canvas.getContext('2d');
        let spores = [];
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Spore {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(217, 119, 43, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<100; i++) spores.push(new Spore());

        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            spores.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
