<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivalist Profile | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ОСНОВНІ ЗМІННІ КОЛЬОРІВ */
        :root {
    --bg-color: #0a0c08;
    --main-green: #4b5e2f;
    --dark-green: #1a230f;
    --accent-orange: #ff9d2f;
    --text-gray: #cfcfcf;
    --border-rust: #5a3f25;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            font-family: "Press Start 2P", cursive;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОНОВІ ШАРИ === */
        
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
        }

        /* Твоя основна картинка */
        .base-image {
    position: absolute;
    width: 100%;
    height: 100%;
    background: 
        linear-gradient(rgba(10,12,8,0.75), rgba(10,12,8,0.9)),
        url('background.png') no-repeat center center;
    background-size: cover;
    filter: blur(2px) brightness(0.5) contrast(1.2);
}

        /* Віньєтка (затемнення країв) */
        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
        }

        /* Текстура бруду на склі */
        .dirt-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dust.png');
            opacity: 0.3;
            pointer-events: none;
        }

        /* Шар ліан та моху */
        .moss-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/leaf.png');
            opacity: 0.2;
            filter: invert(1) sepia(1) hue-rotate(50deg) brightness(0.3);
            pointer-events: none;
        }

        /* === ЦЕНТРАЛЬНИЙ БЛОК === */

        .main-terminal {
            background: 
        url('https://www.transparenttextures.com/patterns/grunge-wall.png'),
        rgba(15, 18, 12, 0.95)
            position: relative;
            width: 440px;
            padding: 50px;
            border: 3px solid var(--main-green);
            box-shadow: 
                0 0 30px rgba(0,0,0,0.8),
                inset 0 0 15px rgba(62, 76, 45, 0.3);
            /* Ефект старого паперу/пластику */
            clip-path: polygon(
                0% 5%, 3% 0%, 97% 0%, 100% 4%, 
                100% 94%, 96% 100%, 4% 100%, 0% 96%
            );
        }
        .main-terminal::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 80% 20%, rgba(255,157,47,0.08), transparent 40%);
    pointer-events: none;
}

        /* Декоративні елементи на рамці */
        .corner-detail {
            position: absolute;
            width: 15px;
            height: 15px;
            background: var(--accent-orange);
            opacity: 0.4;
            filter: blur(4px);
        }
        .c-tl { top: 5px; left: 5px; }
        .c-br { bottom: 5px; right: 5px; }

        header {
            margin-bottom: 40px;
            border-bottom: 2px solid var(--main-green);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #efefef;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 8px;
            color: var(--main-green);
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* === КНОПКИ (LINKS) === */

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .action-btn {
            position: relative;
            display: block;
            padding: 20px;
            background: linear-gradient(90deg, rgba(62, 76, 45, 0.1) 0%, transparent 100%);
            border: 1px solid var(--dark-green);
            text-decoration: none;
            color: var(--text-gray);
            font-size: 11px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .action-btn::before {
            content: "> ";
            color: var(--accent-orange);
            opacity: 0;
            transition: 0.3s;
        }

        .action-btn:hover {
            color: var(--accent-orange);
            border-color: var(--accent-orange);
            background: rgba(212, 140, 42, 0.05);
            transform: scale(1.05) rotate(-1deg);
            padding-left: 30px;
        }

        .action-btn:hover::before {
            opacity: 1;
        }
        .action-btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,157,47,0.2), transparent);
    transition: 0.5s;
}

.action-btn:hover::after {
    left: 100%;
}

        /* === СТАТУС-БАР === */

        .status-container {
            margin-top: 50px;
            text-align: left;
        }

        .status-label {
            font-size: 8px;
            color: var(--main-green);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bg {
            height: 10px;
            background: #000;
            border: 1px solid var(--dark-green);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 26%;
            background: var(--main-green);
            box-shadow: 0 0 15px var(--main-green);
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
            55% { opacity: 0.9; }
        }

        /* === ЕФЕКТИ ЧАСТИНОК (КАНВАС) === */

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Ефект шуму (Noise) */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.15;
            z-index: 20;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="background-container">
        <div class="base-image"></div>
        <div class="vignette"></div>
        <div class="moss-layer"></div>
        <div class="dirt-overlay"></div>
    </div>

    <canvas id="particle-canvas"></canvas>
    <div class="noise-overlay"></div>

    <main class="main-terminal">
        <div class="corner-detail c-tl"></div>
        <div class="corner-detail c-br"></div>

        <header>
            <h1>SURVIVOR: VLAD</h1>
            <div class="subtitle">Location: Sector 17-K</div>
        </header>

        <nav class="links-group">
            <a href="https://t.me/vladoskarburator" class="action-btn" target="_blank">SEND TELEGRAM</a>
            <a href="https://www.instagram.com/opria_vlad/" class="action-btn" target="_blank">OPEN ARCHIVE: INSTAGRAM</a>
            <a href="https://www.twitch.tv/vlad1703gg" class="action-btn" target="_blank">SIGNAL: TWITCH</a>
        </nav>

        <div class="status-container">
            <div class="status-label">
                <span>CORDYCEPS INFECTION</span>
                <span>26%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill"></div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        const particleCount = 120;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.size = Math.random() * 2.5;
                this.alpha = Math.random() * 0.5;
                this.color = Math.random() > 0.5 ? '#d48c2a' : '#3e4c2d';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
