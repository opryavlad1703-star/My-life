<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --fungus: #d9772b;
            --moss: #3a4b2a;
            --dark-panel: #0d0f0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Rajdhani', sans-serif;
            background-color: #000;
            color: #e0e0e0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-main {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            z-index: -3;
            filter: contrast(1.1) brightness(0.8);
            animation: pulseBg 10s infinite alternate;
        }

        @keyframes pulseBg {
            from { filter: contrast(1.1) brightness(0.75); }
            to { filter: contrast(1.2) brightness(0.9); }
        }

        .film-grain {
            position: fixed;
            inset: 0;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .vines {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 0% 0%, var(--moss) 0%, transparent 30%),
                radial-gradient(circle at 100% 100%, #1a230e 0%, transparent 35%);
            mix-blend-mode: multiply;
            opacity: 0.7;
            z-index: -2;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 380px;
            padding: 50px 30px;
            background: rgba(13, 15, 10, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 122, 0, 0.2);
            border-left: 4px solid var(--fungus);
            box-shadow: 
                0 0 80px rgba(0,0,0,0.9),
                0 0 20px rgba(217, 119, 43, 0.2);
            text-align: center;
        }

        .container::after {
            content: "☣";
            position: absolute;
            top: -20px;
            right: 20px;
            font-size: 40px;
            color: var(--fungus);
            opacity: 0.2;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 35px 0;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px 0px var(--fungus);
        }

        .link-card {
            display: block;
            background: #1a1a1a;
            border: 1px solid #333;
            margin: 15px 0;
            padding: 20px;
            text-decoration: none;
            color: #888;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .link-card:hover {
            background: #222;
            color: #fff;
            border-color: var(--fungus);
            transform: scale(1.03);
            box-shadow: 
                -10px 0 0 var(--fungus),
                0 0 15px rgba(217,119,43,0.4);
        }

        .status-area {
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .label {
            font-size: 11px;
            color: var(--fungus);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .bar-bg {
            height: 4px;
            background: #000;
            width: 100%;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: var(--fungus);
            box-shadow: 0 0 10px var(--fungus);
        }

        #spores {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* зараження */
        #infection-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9));
            opacity: 0;
            transition: 1s;
        }

        .infected #infection-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="background-main"></div>
<div class="vines"></div>
<div class="film-grain"></div>
<canvas id="spores"></canvas>
<div id="infection-overlay"></div>

<div class="container">
    <h1>SURVIVOR:VLAD</h1>
    
    <a href="https://t.me/vladoskarburator" target="_blank" class="link-card">Access Telegram</a>
    <a href="https://www.instagram.com/opria_vlad/" target="_blank" class="link-card">View Archives</a>
    <a href="https://www.twitch.tv/vlad1703gg" target="_blank" class="link-card">Twitch Stream</a>

    <div class="status-area">
        <div class="label">INFECTION LEVEL</div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
    </div>
</div>

<script>
let infectionLevel = 0;
const maxInfection = 62;

function increaseInfection() {
    if (infectionLevel < maxInfection) {
        infectionLevel++;
        document.querySelector('.bar-fill').style.width = infectionLevel + "%";

        if (infectionLevel > 50) {
            document.body.classList.add("infected");
        }

        setTimeout(increaseInfection, 40);
    }
}

increaseInfection();

const canvas = document.getElementById('spores');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let particles = Array.from({length: 70}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    v: Math.random() * 0.5 + 0.2,
    s: Math.random() * 2
}));

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(217,119,43,0.4)";
    
    particles.forEach(p => {
        p.y -= p.v;
        if (p.y < 0) p.y = canvas.height;
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
