<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivalist Profile | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ОСНОВНІ ЗМІННІ */
        :root {
            --bg-color: #0a0c08;
            --main-green: #6b8243; /* Трохи світліший зелений для кращого контрасту */
            --dark-green: #2a3a1f;
            --accent-orange: #d47e2a; /* Приглушений оранжевий як на фото */
            --text-white: #efefef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: black; 
            font-family: "Press Start 2P", cursive;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОНОВІ ШАРИ === */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
        }

        .base-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                url('background.png') no-repeat center center; /* Твоя картинка фону */
            background-size: cover;
            filter: brightness(0.7) contrast(1.1);
        }

        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        .dirt-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dust.png');
            opacity: 0.2;
            z-index: 3;
            pointer-events: none;
        }

        /* === ЦЕНТРАЛЬНИЙ БЛОК (ТАБЛИЧКА) === */
        .main-terminal {
            position: relative;
            width: 460px; /* Трохи ширше */
            padding: 40px;
            background: rgba(12, 16, 12, 0.85); /* Темніший, менш прозорий фон */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(107, 130, 67, 0.4); /* Тонка зелена рамка */
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 100;
        }

        /* Кутові оранжеві дужки */
        .corner-detail {
            position: absolute;
            width: 15px;
            height: 15px;
            border-color: var(--accent-orange);
            border-style: solid;
        }
        /* Лівий верхній кут */
        .c-tl { 
            top: -1px; 
            left: -1px; 
            border-width: 2px 0 0 2px; 
        }
        /* Правий нижній кут */
        .c-br { 
            bottom: -1px; 
            right: -1px; 
            border-width: 0 2px 2px 0; 
        }

        /* === ШАПКА === */
        header {
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(107, 130, 67, 0.4);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            color: var(--text-white);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 8px;
            color: var(--main-green);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* === КНОПКИ === */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            display: block;
            padding: 15px 20px;
            background: rgba(42, 58, 31, 0.15);
            border: 1px solid rgba(107, 130, 67, 0.3);
            text-decoration: none;
            color: var(--text-white);
            font-size: 10px;
            text-align: left; /* Вирівнювання як на фото */
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .action-btn:hover {
            color: #fff;
            border-color: var(--main-green);
            background: rgba(107, 130, 67, 0.2);
            padding-left: 25px; /* Легкий зсув тексту при наведенні */
        }

        /* === СТАТУС-БАР === */
        .status-container {
            margin-top: 35px;
        }

        .status-label {
            font-size: 7px;
            color: var(--main-green);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            letter-spacing: 1px;
        }

        .progress-bg {
            height: 6px; /* Більш тонка смуга завантаження */
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(107, 130, 67, 0.4);
        }

        .progress-fill {
            height: 100%;
            width: 23%; /* Змінено на 23% за референсом */
            background: var(--main-green);
            box-shadow: 0 0 5px var(--main-green);
        }

        /* === ЧАСТИНКИ ТА ШУМ === */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.1;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="base-image"></div>
        <div class="vignette"></div>
        <div class="dirt-overlay"></div>
    </div>

    <canvas id="particle-canvas"></canvas>
    <div class="noise-overlay"></div>

    <main class="main-terminal">
        <div class="corner-detail c-tl"></div>
        <div class="corner-detail c-br"></div>

        <header>
            <h1>SURVIVOR: VLAD</h1>
            <div class="subtitle">LOCATION: SECTOR 17-K</div>
        </header>

        <nav class="links-group">
            <a href="https://t.me/vladoskarburator" class="action-btn" target="_blank">&gt; SEND TELEGRAM</a>
            <a href="https://www.instagram.com/opria_vlad/" class="action-btn" target="_blank">&gt; OPEN ARCHIVE: INSTAGRAM</a>
            <a href="https://www.twitch.tv/vlad1703gg" class="action-btn" target="_blank">&gt; SIGNAL: TWITCH</a>
        </nav>

        <div class="status-container">
            <div class="status-label">
                <span>CKDXT M90-MTX 119PCS17 720N</span>
                <span>23%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill"></div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Палітра: пильно-зелений, тьмяно-жовтий, колір цвілі
        const sporeColors = ['#7a8c5a', '#9eb07a', '#c9b16d', '#4d5c36'];

        class Particle {
            constructor() { 
                this.reset(true); 
            }
            
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : canvas.height + 20;
                
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() * -0.4) - 0.1; 
                
                this.size = Math.random() * 2.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.color = sporeColors[Math.floor(Math.random() * sporeColors.length)];
                
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.05;
                
                this.blur = this.size < 1.2 ? Math.random() * 2 : 0;
            }
            
            update() {
                this.wobble += this.wobbleSpeed;
                this.x += this.vx + Math.cos(this.wobble) * 0.2;
                this.y += this.vy;
                
                this.alpha += (Math.random() - 0.5) * 0.02;
                if (this.alpha <= 0) this.alpha = 0.1;
                if (this.alpha > 0.6) this.alpha = 0.6;

                if (this.y < -20) this.reset();
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                
                if (this.blur > 0) {
                    ctx.filter = `blur(${this.blur}px)`;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.size > 1.8) {
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = this.color;
                }

                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 150; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { 
                p.update(); 
                p.draw(); 
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

</body>
</html>
