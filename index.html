<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Profile | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #040502;
            --moss-green: #3a4b2a;
            --fungus-orange: #d48c2a;
            --rust-red: #8b0000;
            --text-gray: #a0a0a0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: "Press Start 2P", system-ui;
            background-color: var(--bg-color);
            /* --- ИЗМЕНЕНИЕ 1: НАСТОЯЩИЙ АТМОСФЕРНЫЙ ФОН (КОМНАТА И ГРИБЫ) --- */
            /* Используем качественное изображение текстуры мха/грибов на старой стене */
            background-image: 
                radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%),
                url('https://images.unsplash.com/photo-1598124237199-a9a7a6c9e0a0?q=80&w=1920'); /* Текстура мха/плесени */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Это решает проблему "уезжания" фона */
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ИЗМЕНЕНИЕ 2: ЧАСТИЦЫ ТЕПЕРЬ ЛЕТАЮТ ИНТЕНСИВНО И СЛУЧАЙНО --- */
        #spores-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Основной контейнер */
        .container {
            position: relative;
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            /* --- ИЗМЕНЕНИЕ 3: БЛОК ПЕРЕСТАЛ БЫТЬ ПРЯМОУГОЛЬНЫМ (clip-path органической формы) --- */
            background: rgba(13, 15, 10, 0.95);
            padding: 45px 30px;
            border: 1px solid var(--moss-green);
            clip-path: polygon(
                5% 0%, 95% 0%, 100% 10%, 100% 90%, 95% 100%, 5% 100%, 0% 90%, 0% 10%
            ); /* Восьмиугольная органическая форма */
            box-shadow: 
                0 0 40px rgba(74, 93, 35, 0.3),
                inset 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- ИЗМЕНЕНИЕ 4: ДОБАВЛЯЕМ ОРГАНИЧЕСКИЕ "ГРИБНЫЕ НАРОСТЫ" НА КРАЯ БЛОКА --- */
        .container::before {
            content: "";
            position: absolute;
            top: -15px; left: -15px; width: 40px; height: 40px;
            background: url('https://www.transparenttextures.com/patterns/dark-rock.png'), #d48c2a;
            border-radius: 50%;
            box-shadow: 0 0 15px #d48c2a;
            opacity: 0.8;
            filter: blur(1px);
        }
        .container::after {
            content: "";
            position: absolute;
            bottom: -20px; right: 10px; width: 60px; height: 15px;
            background: #d48c2a;
            border-radius: 20px;
            opacity: 0.5;
            filter: blur(2px);
        }

        h1 {
            font-size: 13px;
            letter-spacing: 2px;
            color: #efefef;
            margin-bottom: 35px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--moss-green);
            display: inline-block;
            padding-bottom: 12px;
            text-shadow: 2px 2px 0 #000;
        }

        /* Кнопки выжившего */
        .link-card {
            display: block;
            background: rgba(20, 25, 15, 0.95);
            border: 1px solid var(--moss-green);
            margin: 18px 0;
            padding: 18px;
            text-decoration: none;
            color: #fff;
            position: relative;
            transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            /* Неровная форма */
            clip-path: polygon(1% 0%, 100% 3%, 99% 97%, 0% 100%);
        }

        .link-card:hover {
            border-color: var(--fungus-orange);
            color: var(--fungus-orange);
            transform: translateX(8px) rotate(0.5deg);
            background: rgba(30, 25, 10, 1);
            box-shadow: 0 0 15px rgba(212, 140, 42, 0.2);
        }

        /* Эффект мерцания кнопок */
        .link-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 140, 42, 0.05), transparent);
            animation: flicker-light 3s infinite;
        }

        @keyframes flicker-light {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .link-title {
            display: block;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .link-desc {
            display: block;
            font-size: 7px;
            color: var(--text-gray);
            text-transform: none;
        }

        /* СТАТУС БАР */
        .status-bar {
            margin-top: 40px;
            text-align: left;
        }

        .health-bg {
            width: 100%;
            height: 5px;
            background: #222;
            position: relative;
            border: 1px solid rgba(74, 93, 35, 0.2);
        }

        .health-fill {
            width: 74%;
            height: 100%;
            background: var(--moss-green);
            box-shadow: 0 0 15px var(--moss-green);
            animation: pulse-health 4s infinite;
        }

        @keyframes pulse-health {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 8px;
            color: var(--moss-green);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .warning {
            font-size: 6px;
            color: #333;
            margin-top: 25px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="spores-canvas"></canvas>

    <div class="container">
        <h1>Выживший: VLAD</h1>

        <a href="https://t.me/vladoskarburator" class="link-card" target="_blank">
            <span class="link-title">Связь: Telegram</span>
            <span class="link-desc">Сигнал зашифрован. Группировка «Цикады».</span>
        </a>

        <a href="https://www.instagram.com/opria_vlad/" class="link-card" target="_blank">
            <span class="link-title">Архив: Instagram</span>
            <span class="link-desc">Старые снимки до эпидемии.</span>
        </a>

        <a href="https://www.twitch.tv/vlad1703gg" class="link-card" target="_blank">
            <span class="link-title">Прямой эфир: Twitch</span>
            <span class="link-desc">Трансляция из безопасной зоны.</span>
        </a>

        <div class="status-bar">
            <div class="health-bg">
                <div class="health-fill"></div>
            </div>
            <div class="status-text">СТАТУС: ЗАРАЖЕНИЕ 26%</div>
        </div>

        <p class="warning">Осторожно: высокая концентрация спор</p>
    </div>

    <script>
        const canvas = document.getElementById('spores-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let spores = [];
        const numSpores = 200; // Количество частиц

        class Spore {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5; // Случайный размер
                this.speedX = (Math.random() - 0.5) * 1.2; // Случайная скорость X
                this.speedY = (Math.random() - 0.5) * 0.8; // Случайная скорость Y
                this.alpha = Math.random(); // Прозрачность
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Перемещение при выходе за границы
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 140, 42, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.random());
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < numSpores; i++) {
                spores.push(new Spore());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < spores.length; i++) {
                spores[i].update();
                spores[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            spores = [];
            init();
        });
    </script>

</body>
</html>
