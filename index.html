<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --moss-green: #4a5d23; 
            --fungus-orange: #d9772b; 
            --fungus-glow: rgba(217, 119, 43, 0.6);
            --decay-text: #b3b3b3;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ГОЛОВНИЙ ФОН (Твоє зображення) === */
        .background-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                /* Темне віньєтування, щоб виділити центр і приглушити світле вікно */
                radial-gradient(circle at center, rgba(10, 10, 5, 0.4) 0%, rgba(0, 0, 0, 0.95) 100%),
                /* ПЕРЕЙМЕНУЙ СВОЄ ФОТО НА bg-tlou.jpg АБО ВСТАВ ТОЧНУ НАЗВУ ТУТ */
                url('bg-tlou.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -2;
            filter: contrast(1.1) saturate(0.8); 
        }

        /* === БАГАТОШАРОВІ ЛІАНИ === */
        .vines-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.35;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Текстура бруду */
            filter: invert(1) brightness(0.3) sepia(1) hue-rotate(50deg);
        }

        /* === ЕФЕКТ ПИЛУ ТА БРУДУ === */
        .overlay-grit {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            background-image: url('https://www.transparenttextures.com/patterns/dust.png');
            opacity: 0.4;
        }

        /* === ЦЕНТРАЛЬНА ПАНЕЛЬ === */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background: rgba(15, 18, 12, 0.85);
            backdrop-filter: blur(4px);
            padding: 40px 30px;
            border: 1px solid var(--moss-green);
            border-left: 4px solid var(--fungus-orange); /* Акцент кордицепса */
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(74, 93, 35, 0.2);
            text-align: center;
            border-radius: 4px;
        }

        /* Грибні нарости (Кордицепс) на панелі */
        .container::before {
            content: "";
            position: absolute;
            top: -15px; right: -10px; width: 60px; height: 40px;
            background: radial-gradient(circle, var(--fungus-orange) 0%, transparent 70%);
            filter: blur(8px);
            opacity: 0.5;
            animation: breathe 4s infinite alternate;
        }

        .container::after {
            content: "";
            position: absolute;
            bottom: -10px; left: -10px; width: 50px; height: 50px;
            background: radial-gradient(circle, var(--moss-green) 0%, transparent 70%);
            filter: blur(10px);
            opacity: 0.6;
        }

        @keyframes breathe {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.6; transform: scale(1.1); }
        }

        h1 {
            font-size: 28px;
            color: #eaeaea;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px #000, 0 0 10px var(--fungus-glow);
            text-transform: uppercase;
        }

        /* === КНОПКИ === */
        .link-card {
            display: block;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            margin: 15px 0;
            padding: 15px;
            text-decoration: none;
            color: var(--decay-text);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--fungus-glow), transparent);
            transition: 0.5s;
        }

        .link-card:hover {
            border-color: var(--fungus-orange);
            color: #fff;
            background: rgba(217, 119, 43, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--fungus-glow);
        }

        .link-card:hover::before {
            left: 100%;
        }

        /* === СТАТУС БАР (Рівень зараження) === */
        .status-container {
            font-size: 14px; 
            color: var(--fungus-orange); 
            margin-top: 35px; 
            text-align: left;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .health-bar {
            height: 8px;
            width: 100%;
            background: #1a1a1a;
            margin-top: 8px;
            border: 1px solid #333;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            width: 26%; /* Рівень зараження */
            background: linear-gradient(90deg, var(--moss-green), var(--fungus-orange));
            box-shadow: 0 0 10px var(--fungus-orange);
            animation: pulse-infection 2s infinite;
        }

        @keyframes pulse-infection { 
            0% { opacity: 0.7; } 
            50% { opacity: 1; } 
            100% { opacity: 0.7; } 
        }

        /* === КАНВАС ДЛЯ СПОР === */
        #spores-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="background-main"></div>
    <div class="vines-layer"></div>
    <div class="overlay-grit"></div>
    <canvas id="spores-canvas"></canvas>

    <div class="container">
        <h1>Survivor: Vlad</h1>
        
        <a href="https://t.me/vladoskarburator" class="link-card" target="_blank">Telegram [Encrypted]</a>
        <a href="https://www.instagram.com/opria_vlad/" class="link-card" target="_blank">Instagram [Old World]</a>
        <a href="https://www.twitch.tv/vlad1703gg" class="link-card" target="_blank">Twitch [Outpost]</a>

        <div class="status-container">
            INFECTION LEVEL: 26%
            <div class="health-bar"><div class="health-fill"></div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spores-canvas');
        const ctx = canvas.getContext('2d');
        let spores = [];
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Spore {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Спори в TLOU зазвичай повільно летять вгору
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() * -1) - 0.2; 
                this.size = Math.random() * 2.5 + 0.5;
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            draw() {
                ctx.fillStyle = `rgba(217, 119, 43, ${this.alpha})`; // Колір кордицепса
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.x += this.vx; 
                this.y += this.vy;
                
                // Якщо спора вилітає за екран, повертаємо її знизу
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        for(let i=0; i<120; i++) spores.push(new Spore());

        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            spores.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
