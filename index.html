<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #050703; --moss: #3a4b2a; --fungus: #d48c2a; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: "Press Start 2P", cursive; background-color: var(--bg-dark); color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* ГОЛОВНИЙ ФОН */
        .background-main {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.85) 100%),
                        url('background.png');
            background-size: cover; background-position: center; z-index: -2;
            filter: brightness(0.55) contrast(1.1);
        }

        /* ЛІАНИ (VINES) */
        .vines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; opacity: 0.4; background-image: url('https://www.transparenttextures.com/patterns/leaf.png'); filter: invert(1) brightness(0.2) sepia(1) hue-rotate(60deg); }

        /* ЕФЕКТ ПИЛУ */
        .grit { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; background-image: url('https://www.transparenttextures.com/patterns/dust.png'); opacity: 0.18; }

        /* ЦЕНТРАЛЬНА ПАНЕЛЬ */
        .container { position: relative; z-index: 10; width: 90%; max-width: 440px; background: rgba(10, 12, 8, 0.93); padding: 40px; border: 2px solid var(--moss); clip-path: polygon(2% 0%, 97% 1%, 100% 6%, 98% 96%, 94% 100%, 4% 98%, 0% 92%, 1% 5%); box-shadow: 0 0 40px #000; text-align: center; }
        
        h1 { font-size: 13px; color: #ddd; border-bottom: 2px solid var(--moss); padding-bottom: 15px; margin-bottom: 30px; text-shadow: 2px 2px 0 #000; }

        .link-card { display: block; background: rgba(255,255,255,0.03); border: 1px solid var(--moss); margin: 15px 0; padding: 18px; text-decoration: none; color: #eee; font-size: 9px; transition: 0.3s; }
        .link-card:hover { border-color: var(--fungus); color: var(--fungus); background: rgba(212, 140, 42, 0.06); transform: translateX(5px); }

        .status { font-size: 8px; color: var(--moss); margin-top: 25px; text-align: left; }
        .health-bar { height: 6px; width: 100%; background: #111; margin-top: 10px; border: 1px solid #333; }
        .health-fill { height: 100%; width: 26%; background: var(--moss); box-shadow: 0 0 10px var(--moss); }

        #spores { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>
    <div class="background-main"></div>
    <div class="vines"></div>
    <div class="grit"></div>
    <canvas id="spores"></canvas>
    <div class="container">
        <h1>ВЫЖИВШИЙ: VLAD</h1>
        <a href="https://t.me/vladoskarburator" class="link-card" target="_blank">TELEGRAM [ENCRYPTED]</a>
        <a href="https://www.instagram.com/opria_vlad/" class="link-card" target="_blank">INSTAGRAM [OLD WORLD]</a>
        <a href="https://www.twitch.tv/vlad1703gg" class="link-card" target="_blank">TWITCH [OUTPOST]</a>
        <div class="status">
            INFECTION: 26%
            <div class="health-bar"><div class="health-fill"></div></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('spores');
        const ctx = canvas.getContext('2d');
        let spores = [];
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        class Spore {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.vx = (Math.random() - 0.5) * 0.7; this.vy = (Math.random() - 0.5) * 0.4; this.size = Math.random() * 2; this.alpha = Math.random(); }
            draw() { ctx.fillStyle = `rgba(212, 140, 42, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
            update() { this.x += this.vx; this.y += this.vy; if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0; if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0; }
        }
        for(let i=0; i<90; i++) spores.push(new Spore());
        function animate() { ctx.clearRect(0,0, canvas.width, canvas.height); spores.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
        animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
