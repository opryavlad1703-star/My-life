<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --fungus: #d9772b;
            --moss: #3a4b2a;
            --dark-panel: #0d0f0a;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Rajdhani', sans-serif;
            background-color: #000;
            color: #e0e0e0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОН (Твоє фото) === */
        .background-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* ВАЖЛИВО: Назви свою картинку саме так: bg.jpg */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            z-index: -3;
            filter: contrast(1.1) brightness(0.8);
        }

        /* === ЕФЕКТ КІНО-ШУМУ === */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        /* === ЛІАНИ (Малюємо їх прямо поверх екрана) === */
        .vines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 0% 0%, var(--moss) 0%, transparent 30%),
                radial-gradient(circle at 100% 100%, #1a230e 0%, transparent 35%);
            mix-blend-mode: multiply;
            opacity: 0.7;
            z-index: -2;
        }

        /* === ЦЕНТРАЛЬНА ПАНЕЛЬ === */
        .container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 380px;
            background: var(--dark-panel);
            padding: 50px 30px;
            border: 1px solid #222;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            text-align: center;
            /* Ефект "іржі" на краях */
            border-left: 4px solid var(--fungus);
        }

        /* Декор ліан на самій панелі */
        .container::after {
            content: "☣";
            position: absolute;
            top: -20px;
            right: 20px;
            font-size: 40px;
            color: var(--fungus);
            opacity: 0.2;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 35px 0;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px 0px var(--fungus);
        }

        /* === КНОПКИ (Тепер вони виглядають масивно) === */
        .link-card {
            display: block;
            background: #1a1a1a;
            border: 1px solid #333;
            margin: 15px 0;
            padding: 20px;
            text-decoration: none;
            color: #888;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
        }

        .link-card:hover {
            background: #222;
            color: #fff;
            border-color: var(--fungus);
            transform: scale(1.02);
            box-shadow: -10px 0 0 var(--fungus);
        }

        /* === HUD СТАТИСТИКА === */
        .status-area {
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .label {
            font-size: 11px;
            color: var(--fungus);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .bar-bg {
            height: 4px;
            background: #000;
            width: 100%;
        }

        .bar-fill {
            height: 100%;
            width: 26%;
            background: var(--fungus);
            box-shadow: 0 0 10px var(--fungus);
        }

        /* СПОРИ */
        #spores {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="background-main"></div>
    <div class="vines"></div>
    <div class="film-grain"></div>
    <canvas id="spores"></canvas>

    <div class="container">
        <h1>VLAD</h1>
        
        <a href="#" class="link-card">Access Telegram</a>
        <a href="#" class="link-card">View Archives</a>
        <a href="#" class="link-card">Twitch Stream</a>

        <div class="status-area">
            <div class="label">INFECTION LEVEL: 26% / STATUS: CRITICAL</div>
            <div class="bar-bg"><div class="bar-fill"></div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spores');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for(let i=0; i<70; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                v: Math.random() * 0.5 + 0.2,
                s: Math.random() * 2
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(217, 119, 43, 0.4)";
            particles.forEach(p => {
                p.y -= p.v;
                if(p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
