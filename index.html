<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #050505;
            --moss: #2d381c; 
            --fungus: #d9772b; 
            --panel-bg: rgba(10, 12, 8, 0.92);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОН (Виправлено яскравість) === */
        .background-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                /* Подвійний градієнт для поглинання яскравості з вікна */
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
                url('bg-tlou.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -3;
        }

        /* === ЛІАНИ (Додано візуально через тіні та градієнти) === */
        .vines-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            background: 
                radial-gradient(at 10% 10%, var(--moss) 0%, transparent 40%),
                radial-gradient(at 90% 90%, #1a230e 0%, transparent 40%);
            opacity: 0.6;
            filter: contrast(1.5);
        }

        /* Ефект бруду та спор */
        .overlay-grit {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            background-image: url('https://www.transparenttextures.com/patterns/dust.png');
            opacity: 0.3;
        }

        /* === ЦЕНТРАЛЬНА ПАНЕЛЬ === */
        .container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 380px;
            background: var(--panel-bg);
            padding: 40px;
            border: 1px solid rgba(217, 119, 43, 0.3);
            border-left: 5px solid var(--fungus);
            box-shadow: 0 0 50px rgba(0,0,0,1);
            text-align: center;
        }

        /* Нарости грибка на кутах */
        .container::before {
            content: "";
            position: absolute;
            top: -5px; right: -5px; width: 40px; height: 40px;
            background: var(--fungus);
            filter: blur(15px);
            opacity: 0.4;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #efefef;
            text-shadow: 0 0 10px rgba(217, 119, 43, 0.5);
        }

        /* === КНОПКИ (Тепер не прозорі) === */
        .link-card {
            display: block;
            background: #151812; /* Темний непрозорий фон */
            border: 1px solid #3a4b2a;
            margin: 18px 0;
            padding: 16px;
            text-decoration: none;
            color: #ccc;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: 0.3s;
            position: relative;
            text-transform: uppercase;
        }

        .link-card:hover {
            background: #1e2418;
            border-color: var(--fungus);
            color: white;
            box-shadow: 0 0 15px rgba(217, 119, 43, 0.3);
            transform: scale(1.03);
        }

        /* === СТАТУС БАР === */
        .status-area {
            margin-top: 40px;
            text-align: left;
        }

        .status-label {
            font-size: 12px;
            color: var(--fungus);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .health-bar {
            height: 6px;
            width: 100%;
            background: #000;
            border: 1px solid #222;
        }

        .health-fill {
            height: 100%;
            width: 26%;
            background: linear-gradient(90deg, #3a4b2a, var(--fungus));
            box-shadow: 0 0 10px var(--fungus);
        }

        #spores-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="background-main"></div>
    <div class="vines-overlay"></div>
    <div class="overlay-grit"></div>
    <canvas id="spores-canvas"></canvas>

    <div class="container">
        <h1>Survivor: Vlad</h1>
        
        <a href="https://t.me/vladoskarburator" class="link-card" target="_blank">Telegram [Encrypted]</a>
        <a href="https://www.instagram.com/opria_vlad/" class="link-card" target="_blank">Instagram [Old World]</a>
        <a href="https://www.twitch.tv/vlad1703gg" class="link-card" target="_blank">Twitch [Outpost]</a>

        <div class="status-area">
            <div class="status-label">INFECTION LEVEL: 26%</div>
            <div class="health-bar"><div class="health-fill"></div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spores-canvas');
        const ctx = canvas.getContext('2d');
        let spores = [];
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Spore {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() * -0.8) - 0.2;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.5;
            }
            draw() {
                ctx.fillStyle = `rgba(217, 119, 43, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < -10) this.reset();
            }
        }

        for(let i=0; i<80; i++) spores.push(new Spore());

        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            spores.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
