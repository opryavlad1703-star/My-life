<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivalist Profile | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ОСНОВНІ ЗМІННІ */
        :root {
            --bg-color: #0a0c08;
            --main-green: #6a9c4a; /* Більш яскравий зелений для тексту */
            --dark-green: #1a230f;
            --accent-orange: #f28b22; /* Точний відтінок помаранчевого з фото */
            --text-gray: #d0d0d0;
            --btn-bg: rgba(22, 28, 22, 0.8); /* Темний фон кнопок */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: black; 
            font-family: "Press Start 2P", cursive;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОНОВІ ШАРИ === */
        
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
        }

        .base-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), 
                url('background.png') no-repeat center center;
            background-size: cover;
        }

        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        /* === ЦЕНТРАЛЬНИЙ БЛОК === */

        .main-terminal {
            position: relative;
            width: 480px; 
            padding: 45px 40px;
            /* На фото 1 фон темний, майже непрозорий, без сильного блюру */
            background: rgba(10, 12, 10, 0.85); 
            backdrop-filter: blur(3px); 
            -webkit-backdrop-filter: blur(3px);
            
            border: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 2px; 
            z-index: 100;

            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* Точні помаранчеві куточки по краях панелі */
        .corner-detail {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--accent-orange);
            border-style: solid;
        }
        .c-tl { 
            top: -1px; 
            left: -1px; 
            border-width: 2px 0 0 2px; 
        }
        .c-br { 
            bottom: -1px; 
            right: -1px; 
            border-width: 0 2px 2px 0; 
        }

        /* Заголовок і лінія під ним */
        header {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(80, 110, 60, 0.4); /* Тонка зелена лінія як на фото */
            text-align: left;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 8px;
            color: var(--main-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* КНОПКИ (Точно як на фото 1) */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Менша відстань між кнопками */
        }

        .action-btn {
            position: relative;
            display: block;
            padding: 16px 20px;
            background: var(--btn-bg); 
            border: 1px solid rgba(255, 255, 255, 0.05); /* Ледь помітна рамка */
            text-decoration: none;
            color: var(--text-gray);
            font-size: 10px;
            transition: all 0.2s ease;
            text-align: left;
        }

        .action-btn:hover {
            color: #ffffff;
            background: rgba(40, 50, 35, 0.8);
            border-color: rgba(106, 156, 74, 0.5);
            transform: translateX(3px);
        }

        /* СТАТУС-БАР */
        .status-container {
            margin-top: 40px;
        }

        .status-label {
            font-size: 8px;
            color: var(--main-green);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            letter-spacing: 0.5px;
        }

        .progress-bg {
            height: 8px; /* Тонша смужка як на фото */
            background: #050605;
            border: 1px solid rgba(40, 50, 30, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 26%;
            background: #7db840; /* Специфічний "токсичний" зелений */
            box-shadow: 0 0 10px rgba(125, 184, 64, 0.4);
        }

        /* ЧАСТИНКИ */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="background-container">
        <div class="base-image"></div>
        <div class="vignette"></div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <main class="main-terminal">
        <div class="corner-detail c-tl"></div>
        <div class="corner-detail c-br"></div>

        <header>
            <h1>SURVIVOR: VLAD</h1>
            <div class="subtitle">Location: Sector 17-K</div>
        </header>

        <nav class="links-group">
            <a href="https://t.me/vladoskarburator" class="action-btn" target="_blank">> SEND TELEGRAM</a>
            <a href="https://www.instagram.com/opria_vlad/" class="action-btn" target="_blank">> OPEN ARCHIVE: INSTAGRAM</a>
            <a href="https://www.twitch.tv/vlad1703gg" class="action-btn" target="_blank">> SIGNAL: TWITCH</a>
        </nav>

        <div class="status-container">
            <div class="status-label">
                <span>CORDYCEPS INFECTION</span>
                <span>26%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill"></div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#8dc63f';
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script> 

</body>
</html>
