<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivalist Profile | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ОСНОВНІ ЗМІННІ */
        :root {
            --bg-color: #0a0c08;
            /* Змінено на більш насичений зелений для кращої видимості */
            --main-green: #6a8a4a; 
            --dark-green: #1a230f;
            --accent-orange: #ff9d2f;
            --text-gray: #cfcfcf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: black; 
            font-family: "Press Start 2P", cursive;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОНОВІ ШАРИ === */
        
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
        }

        .base-image {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Тут має бути ваше фонове зображення з монітором та Клікером */
            background: 
                linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), 
                url('path_to_your_background.png') no-repeat center center;
            background-size: cover;
            filter: brightness(0.8) contrast(1.1);
        }

        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        /* === ЦЕНТРАЛЬНИЙ БЛОК === */

        .main-terminal {
            position: relative;
            width: 480px; /* Трохи ширше для відповідності зображенню */
            padding: 60px 50px;
            /* Ключові зміни для прозорості: */
            background: rgba(15, 20, 15, 0.5); /* Темний, але прозорий фон */
            backdrop-filter: blur(10px); /* Ефект розмиття заднього плану */
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(120, 180, 80, 0.15); /* Дуже тонка та бліда рамка */
            border-radius: 8px; /* Легке закруглення */
            z-index: 100;

            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        /* Помаранчеві куточки */
        .corner-detail {
            position: absolute;
            width: 25px;
            height: 2px;
            background: var(--accent-orange);
            opacity: 0.9;
        }
        /* Г-подібні куточки (спрощено) */
        .c-tl { top: 15px; left: 15px; }
        .c-tl::after { content:''; position: absolute; top:0; left:0; width:2px; height:25px; background: inherit; }
        
        .c-br { bottom: 15px; right: 15px; }
        .c-br::after { content:''; position: absolute; bottom:0; right:0; width:2px; height:25px; background: inherit; }

        header {
            margin-bottom: 35px;
            text-align: left;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 9px;
            color: var(--main-green);
            text-transform: uppercase;
        }

        /* КНОПКИ */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            position: relative;
            display: block;
            padding: 20px;
            background: rgba(40, 50, 35, 0.4); /* Більш насичений фон кнопок */
            border: 1px solid rgba(80, 100, 70, 0.3);
            text-decoration: none;
            color: var(--text-gray);
            font-size: 11px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .action-btn:hover {
            color: #ffffff;
            border-color: rgba(120, 180, 80, 0.6);
            background: rgba(60, 80, 50, 0.5);
            transform: translateX(4px);
        }

        /* СТАТУС-БАР */
        .status-container {
            margin-top: 40px;
        }

        .status-label {
            font-size: 9px;
            color: var(--main-green);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bg {
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(80, 100, 70, 0.4);
        }

        .progress-fill {
            height: 100%;
            width: 26%;
            background: #8dc63f; /* Яскравий салатовий колір */
            box-shadow: 0 0 15px rgba(141, 198, 63, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 15px rgba(141, 198, 63, 0.7); }
            50% { opacity: 0.8; box-shadow: 0 0 10px rgba(141, 198, 63, 0.5); }
        }

        /* ЧАСТИНКИ */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <div class="background-container">
        <div class="base-image"></div>
        <div class="vignette"></div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <main class="main-terminal">
        <div class="corner-detail c-tl"></div>
        <div class="corner-detail c-br"></div>

        <header>
            <h1>SURVIVOR: VLAD</h1>
            <div class="subtitle">Location: Sector 17-K</div>
        </header>

        <nav class="links-group">
            <a href="https://t.me/vladoskarburator" class="action-btn" target="_blank">> SEND TELEGRAM</a>
            <a href="https://www.instagram.com/opria_vlad/" class="action-btn" target="_blank">> OPEN ARCHIVE: INSTAGRAM</a>
            <a href="https://www.twitch.tv/vlad1703gg" class="action-btn" target="_blank">> SIGNAL: TWITCH</a>
        </nav>

        <div class="status-container">
            <div class="status-label">
                <span>CORDYCEPS INFECTION</span>
                <span>26%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill"></div>
            </div>
        </div>
    </main>

    <script>
        // Скрипт частинок залишено без змін, він працює добре
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.6;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#8dc63f';
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script> 

</body>
</html>
