<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Stats | Vlad</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --moss: #3a4b2a;
            --fungus: #d48c2a;
            --dark: #050703;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Press Start 2P', cursive;
            background-color: var(--dark);
            color: white;
            overflow: hidden;
            perspective: 1000px; /* Для 3D ефекту */
        }

        /* ОСНОВНИЙ ФОН (Твоя кімната) */
        .bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Додаємо шлях саме до твого завантаженого файлу */
    background-image: url('background.png'); 
    background-size: cover;
    background-position: center;
    z-index: -1;
}

        /* КОРДІЦЕПС ТА ПЛІСНЯВА (Накладення) */
        .fungus-texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        /* 3D ЛІАНИ (ПЕРЕДНІЙ ПЛАН) */
        .vines-3d {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
            /* Створюємо ліани через градієнти та маски */
            background: linear-gradient(135deg, rgba(58, 75, 42, 0.4) 0%, transparent 25%),
                        linear-gradient(225deg, rgba(58, 75, 42, 0.4) 0%, transparent 25%);
            filter: blur(1px);
        }

        /* КАРТКА ІНТЕРФЕЙСУ */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(10, 12, 8, 0.9);
            padding: 40px;
            border: 2px solid var(--moss);
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 20px rgba(212, 140, 42, 0.1);
            /* Органічна "погризена" форма */
            clip-path: polygon(2% 0%, 98% 1%, 100% 5%, 99% 95%, 97% 100%, 3% 99%, 0% 96%, 1% 4%);
            transform-style: preserve-3d;
            transition: transform 0.2s;
        }

        h1 {
            font-size: 14px;
            color: #ddd;
            text-shadow: 3px 3px 0px #000;
            border-bottom: 2px solid var(--moss);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .link-card {
            display: block;
            background: rgba(30, 35, 25, 0.8);
            border: 1px solid var(--moss);
            padding: 15px;
            margin: 15px 0;
            text-decoration: none;
            color: #eee;
            font-size: 10px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            background: var(--moss);
            transform: scale(1.05) translateZ(20px);
            border-color: var(--fungus);
            color: var(--fungus);
        }

        /* СТАТУС БАР */
        .health-container {
            margin-top: 30px;
            text-align: left;
        }

        .health-bar {
            height: 8px;
            width: 100%;
            background: #111;
            border: 1px solid #333;
            position: relative;
        }

        .health-fill {
            height: 100%;
            width: 74%;
            background: var(--moss);
            box-shadow: 0 0 15px var(--moss);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #spores-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg"></div>
    <div class="fungus-texture"></div>
    <div class="vines-3d"></div>
    <canvas id="spores-canvas"></canvas>

    <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="container" id="card">
            <h1>Survivor: Vlad</h1>
            
            <a href="https://t.me/vladoskarburator" class="link-card" target="_blank">TELEGRAM [SECURE]</a>
            <a href="https://www.instagram.com/opria_vlad/" class="link-card" target="_blank">INSTAGRAM [ARCHIVE]</a>
            <a href="https://www.twitch.tv/vlad1703gg" class="link-card" target="_blank">TWITCH [LIVE]</a>

            <div class="health-container">
                <div style="font-size: 8px; color: var(--moss); margin-bottom: 5px;">INFECTION LEVEL: 26%</div>
                <div class="health-bar"><div class="health-fill"></div></div>
            </div>
        </div>
    </div>

    <script>
        // ЛІТАЮЧІ СПОРИ
        const canvas = document.getElementById('spores-canvas');
        const ctx = canvas.getContext('2d');
        let spores = [];
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Spore {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
                this.alpha = Math.random();
            }
            draw() {
                ctx.fillStyle = `rgba(212, 140, 42, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
        }

        for(let i=0; i<150; i++) spores.push(new Spore());

        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            spores.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // 3D ПАРАЛАКС (Рух за мишкою)
        const bg = document.getElementById('bg');
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            let x = (e.clientX / window.innerWidth - 0.5) * 20;
            let y = (e.clientY / window.innerHeight - 0.5) * 20;
            
            bg.style.transform = `translate(${x}px, ${y}px) scale(1.1)`;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
</body>
</html>
