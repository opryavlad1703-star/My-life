<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivalist Profile | Vlad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ОСНОВНІ ЗМІННІ */
        :root {
            --bg-color: #0a0c08;
            --main-green: #4b5e2f;
            --dark-green: #1a230f;
            --accent-orange: #ff9d2f;
            --text-gray: #cfcfcf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            /* КРИТИЧНО: прибираємо колір фону, щоб він не перекривав картинку */
            background-color: black; 
            font-family: "Press Start 2P", cursive;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ФОНОВІ ШАРИ === */
        
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* КРИТИЧНО: z-index -1, щоб бути над підкладкою, але під контентом */
            z-index: 1; 
        }

        .base-image {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Налаштування картинки */
            background: 
                linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                url('background.png') no-repeat center center;
            background-size: cover;
            /* Зробили трохи яскравіше, щоб точно бачити результат */
            filter: brightness(0.7) contrast(1.1);
        }

        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        .dirt-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dust.png');
            opacity: 0.2;
            z-index: 3;
            pointer-events: none;
        }

        /* === ЦЕНТРАЛЬНИЙ БЛОК === */

        .main-terminal {
            position: relative;
            width: 440px;
            padding: 50px;
            background: rgba(10, 14, 10, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(120, 180, 80, 0.3);
            z-index: 100; /* Контент завжди зверху */

            clip-path: polygon(
                0% 5%, 3% 0%, 97% 0%, 100% 4%, 
                100% 94%, 96% 100%, 4% 100%, 0% 96%
            );
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .corner-detail {
            position: absolute;
            width: 20px;
            height: 2px;
            background: var(--accent-orange);
            opacity: 0.8;
        }
        .c-tl { top: 10px; left: 10px; }
        .c-br { bottom: 10px; right: 10px; }

        header {
            margin-bottom: 40px;
            border-bottom: 2px solid var(--main-green);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #efefef;
        }

        .subtitle {
            font-size: 8px;
            color: var(--main-green);
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* КНОПКИ */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-btn {
            position: relative;
            display: block;
            padding: 18px;
            background: rgba(62, 76, 45, 0.2);
            border: 1px solid var(--dark-green);
            text-decoration: none;
            color: var(--text-gray);
            font-size: 10px;
            transition: 0.3s;
        }

        .action-btn:hover {
            color: var(--accent-orange);
            border-color: var(--accent-orange);
            background: rgba(212, 140, 42, 0.1);
            padding-left: 25px;
            transform: translateX(5px);
        }

        /* СТАТУС-БАР */
        .status-container {
            margin-top: 40px;
        }

        .status-label {
            font-size: 8px;
            color: var(--main-green);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bg {
            height: 12px;
            background: #000;
            border: 1px solid var(--dark-green);
        }

        .progress-fill {
            height: 100%;
            width: 26%;
            background: var(--main-green);
            box-shadow: 0 0 10px var(--main-green);
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.1;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="base-image"></div>
        <div class="vignette"></div>
        <div class="dirt-overlay"></div>
    </div>

    <canvas id="particle-canvas"></canvas>
    <div class="noise-overlay"></div>

    <main class="main-terminal">
        <div class="corner-detail c-tl"></div>
        <div class="corner-detail c-br"></div>

        <header>
            <h1>SURVIVOR: VLAD</h1>
            <div class="subtitle">Location: Sector 17-K</div>
        </header>

        <nav class="links-group">
            <a href="https://t.me/vladoskarburator" class="action-btn" target="_blank">> SEND TELEGRAM</a>
            <a href="https://www.instagram.com/opria_vlad/" class="action-btn" target="_blank">> OPEN ARCHIVE: INSTAGRAM</a>
            <a href="https://www.twitch.tv/vlad1703gg" class="action-btn" target="_blank">> SIGNAL: TWITCH</a>
        </nav>

        <div class="status-container">
            <div class="status-label">
                <span>CORDYCEPS INFECTION</span>
                <span>26%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill"></div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.5;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#4b5e2f';
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script> 

</body>
</html>
